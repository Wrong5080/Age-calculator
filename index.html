<!DOCTYPE html>

    <html lang="en">

        <head>

            <meta charset="UTF-8">

            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            
            <title>Age Calculator</title>

            <link rel="stylesheet" href="style.css">

        </head>

        <body>

            <div class="top">

                <h1>Age Calculator</h1>

            </div>

        <section class="card">

            <div class="as">

                <h3>Enter your birth year to calculate your age</h3>

            </div>

            <div class="form">

                <input type="number" id="birthYear" placeholder="Enter your birth year">
            
            </div>

            <div class="age">

                <button type="button" id="calculatebtn">Calculate Age</button>

            </div>

            <p id="result"></p>

        </section>

            <script src="script.js"></script>

        </body>

    </html>
